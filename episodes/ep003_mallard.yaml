id: ep003_mallard
series: The Record
title: "The steam record nobody has beaten since 1938"
format: short
description: >
  On 3 July 1938 a blue streamlined locomotive called Mallard went faster than
  any steam engine ever had — or ever has since.
tags: [trains, steam locomotive, mallard, LNER A4, world record, railway history]
voice:
  voice_id: pNInz6obpgDQGcFmaJgB
  model_id: eleven_multilingual_v2
  stability: 0.4
  similarity_boost: 0.75
  style: 0.6
segments:
  - say: "In 1938, a steam engine hit one hundred and twenty-six miles per hour."
    punch: "126 MPH. STEAM."
    footage: {query: "Mallard locomotive", type: image}
  - say: "And in almost ninety years… no steam engine has ever beaten it."
    punch: "STILL UNBEATEN"
    footage: {query: "steam locomotive", type: video}
  - say: "Its name was Mallard. A British A4, designed by Sir Nigel Gresley."
    punch: "LNER A4 'MALLARD'"
    footage: {query: "LNER A4", type: image}
  - say: "That streamlined shell wasn't for looks. It was shaped in a wind tunnel to slice through air."
    punch: "WIND-TUNNEL SHAPED"
    footage: {query: "LNER A4 streamlined", type: image}
  - say: "Third of July, 1938. Stoke Bank, a long downhill stretch south of Grantham."
    punch: "3 JULY 1938"
    footage: {query: "East Coast Main Line", type: video}
  - say: "Driver Joe Duddington opened her up. Fireman Tommy Bray shovelled like his life depended on it."
    punch: "FULL THROTTLE"
    footage: {query: "steam locomotive firebox", type: image}
  - say: "One twenty. One twenty-four. One twenty-six."
    punch: "126 MPH / 203 KM/H"
    footage: {query: "steam locomotive speed", type: video}
  - say: "But a bearing in the middle cylinder overheated, releasing a stink bomb built in to warn the crew."
    punch: "STINK BOMB?!"
    footage: {query: "steam locomotive wheels motion", type: video}
  - say: "Mallard limped home for repairs. The record stayed."
    punch: "RECORD STANDS"
    footage: {query: "Mallard National Railway Museum", type: image}
  - say: "You can still stand next to her today, at the National Railway Museum in York."
    punch: "NRM, YORK"
    footage: {query: "National Railway Museum York", type: image}
  - say: "Should someone try to break it? Tell me below."
    punch: "TRY AGAIN?"
    footage: {query: "steam train", type: video}
sources:
  - "National Railway Museum, 'Mallard' collection object 1975-7003"
  - "https://en.wikipedia.org/wiki/LNER_Class_A4_4468_Mallard"
