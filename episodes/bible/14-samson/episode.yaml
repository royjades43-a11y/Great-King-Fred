# Bible Stories in Stained Glass - 14. Samson   (Great Window format: story, then "reading the window")
#
# Look, voice and music come from ../series.yaml; recurring characters from ../cast.yaml.
#
# Sources (KJV):
#   Judges 13:2-5    the angel and Manoah's wife; no razor; a Nazarite from the womb; "begin to deliver Israel"
#   Numbers 6:3-6    the Nazarite vow: no wine or grapes, no razor, no touching the dead
#   Judges 13:25, 14:6, 14:19, 15:14   "the Spirit of the LORD came (mightily) upon him"
#   Judges 14:5-6    the young lion in the vineyards of Timnah; "he told not his father or his mother"
#   Judges 14:8-10   honey from the lion's carcase; "Samson made there a feast" (Hebrew mishteh, a drinking feast)
#   Judges 15:9-15   bound by the men of Judah with two new cords; the cords became as burnt flax; a new jawbone; a thousand men
#   Judges 16:1-3    Gaza: the doors of the gate, the two posts and the bar, carried to a hilltop
#   Judges 16:4-17   Delilah; 1100 pieces of silver from each lord; three lies; "told her all his heart"
#   Judges 16:19-20  asleep on her knees; seven locks shaved; "he wist not that the LORD was departed from him"
#   Judges 16:21-22  eyes put out, fetters of brass, grinding in the prison house; "the hair ... began to grow again"
#   Judges 16:23-30  feast to Dagon; three thousand on the roof; a lad led him; the prayer; the two middle pillars;
#                    "the dead which he slew at his death were more than they which he slew in his life"
#   Hebrews 11:32    Samson named among the faithful;  Luke 23:34  "Father, forgive them"

title: Samson
seed: 14
pane: {scene: cold_open, number: 14, center: [0.5, 0.6], radius: 0.42}
voice:
  respell: {Dagon: Daygon}
pronounce:
  Delilah: dih-LY-lah
  Timnah: TIM-nah
  Nazarite: NAZ-a-rite (one set apart by a vow)
  Dagon: DAY-gon

scenes:
  # ======================================================================= the story
  - id: cold_open
    set: {name: glass_hall}
    open: glass
    close: fade
    mood: tense
    cast:
      temple: {prop: glass_temple, params: {crowd: 0}, at: [0.5, 0.95], height: 0.8, depth: 0.9}
      crowd: {prop: glass_crowd, at: [0.5, 0.31], height: 0.13, depth: 0.9}
      samson: {character: samson, params: {pose: chained, hair: short, blind: true}, at: [0.5, 0.95], height: 0.42}
    narration: |
      [spot:samson] He was the strongest man who ever lived.
      [laugh:crowd] [spot:crowd] And this is how his story ended.
      [spot:samson:tight] [say:Blind. In chains.|ruby|center] Blind. [shake:samson] In chains.
      [laugh:crowd] [spot:crowd:wide] Brought out [shake:samson] to entertain the enemies of his people.
      [push:samson] [spot:samson] How did the strongest man [spot:samson:tight] in the Bible end up here?
      [title:SAMSON|Judges 13-16] [laugh:crowd] [pause:1.0]

  - id: the_promise
    set: {name: glass_birth}
    open: glass
    close: fade
    mood: psalm
    cast:
      altar: {prop: glass_altar, at: [0.5, 0.95], height: 0.2, depth: 0.85, fx: [flames], flame_size: 0.012}
      angel: {character: angel, at: [0.28, 0.95], height: 0.52, hidden: true}
      mother: {prop: glass_woman, params: {robe: blue, mantle: white}, at: [0.74, 0.95], height: 0.44}
    narration: |
      [spot:mother] It began with a promise.
      [appear:angel] [flash:gold] [spot:angel] An angel appeared to a childless woman in Israel.
      [recoil:mother] [spot:mother] She would have a son, he told her.
      [spot:mother:tight] [say:a Nazarite] And he would be a Nazarite, [flash:gold] set apart to God [spot:angel] before he was born.
      [spot:angel:wide] Under the law of Moses, [label:angel.head|No wine] a Nazarite drank no wine,
      [label:angel|Nothing dead] touched nothing dead, [label:mother.head|No razor] and never cut his hair.
      [spot:angel:wide] This boy, he said, [hop:mother] would begin to deliver Israel [spot:mother] from the Philistines.
      [ignite:altar] [spot:altar] And when an offering was made on the altar,
      [ascend:angel] [flash:gold] [spot:altar:wide] the angel rose up to heaven in the flame.

  - id: the_lion
    set: {name: glass_vineyard}
    open: glass
    close: fade
    mood: battle
    cast:
      samson: {character: samson, at: [0.3, 0.95], height: 0.46}
      lion: {prop: glass_lion, at: [0.74, 0.95], height: 0.3}
    narration: |
      [spot:samson] Samson grew up strong.
      [enter:lion] [spot:lion] In the vineyards of Timnah, [lunge:lion] [quake] a young lion came roaring at him.
      [lunge:lion] [recoil:samson] [quake] [spot:samson] The Spirit of the LORD [flash:gold] [shake:samson] came mightily upon him.
      [lunge:samson] [shake:lion] [quake] [say:with his bare hands] He tore the lion apart [lunge:samson] [shake:lion] [quake] with his bare hands.
      [fall:lion:right] [spot:samson:tight] And he told no one.

  - id: the_jawbone
    set: {name: glass_valley}
    open: glass
    close: fade
    mood: battle
    cast:
      army: {character: philistine_army, params: {count: 6}, at: [0.74, 0.95], height: 0.3}
      fallen: {prop: glass_fallen, at: [0.66, 0.97], height: 0.2, hidden: true}
      bound: {character: samson, params: {bound: ropes}, at: [0.3, 0.95], height: 0.46}
      samson: {character: samson, params: {pose: jawbone}, at: [0.3, 0.95], height: 0.5, hidden: true}
    narration: |
      [spot:bound] Later, his own people tied him with two new ropes, [shake:bound] [spot:bound:tight] and handed him over [spot:army] to the Philistines.
      [enter:army] [spot:army] The Philistines ran at him, shouting.
      [shake:bound] [spot:bound:tight] Then the Spirit of the LORD came upon him,
      [swap:bound:samson] [flash:gold] [quake] and the ropes fell from his arms like burnt thread.
      [spot:samson] He grabbed the only weapon he could find, [spot:samson.head] [hop:samson] the fresh jawbone of a donkey.
      [lunge:samson] [shake:army] [quake] [say:a thousand men] And with it, [lunge:samson] [shake:army] [quake] he struck down [vanish:army] [appear:fallen] [spot:fallen:wide] [quake] a thousand men.
      [tilt:samson:-4] [spot:samson:tight] One man. A thousand enemies.

  - id: the_gates
    set: {name: glass_gaza}
    open: glass
    close: fade
    mood: tense
    cast:
      guard1: {character: philistine, params: {weapon: spear}, at: [0.64, 0.93], height: 0.34}
      guard2: {character: philistine, params: {weapon: spear}, at: [0.92, 0.93], height: 0.34}
      samson: {character: samson, params: {pose: lift}, at: [0.24, 0.92], height: 0.42}
      gates: {prop: glass_gates, at: [0.24, 0.53], height: 0.24, depth: 1.0}
    narration: |
      [spot:guard1] In Gaza, his enemies surrounded the city, [spot:guard2] and lay in wait all night to kill him at dawn.
      [spot:samson] But at midnight, Samson rose.
      [shake:samson] [spot:gates] He took hold of the city gates, [shake:gates] [quake] and pulled them up, [hop:gates] [quake] posts, bar and all.
      [move:samson:0.78] [move:gates:0.78] [recoil:guard1] [spot:samson] And he carried them on his shoulders [recoil:guard2] [spot:guard2] to the top of a hill.

  - id: the_offer
    set: {name: glass_house}
    open: glass
    close: fade
    mood: mystery
    cast:
      delilah: {character: delilah, at: [0.5, 0.95], height: 0.46}
      lord: {character: philistine, params: {weapon: spear, face: right}, at: [0.2, 0.95], height: 0.46}
      silver: {prop: glass_silver, at: [0.78, 0.97], height: 0.12}
    narration: |
      [spot:delilah] Then he fell in love with a woman named Delilah.
      [enter:lord] [spot:lord] The Philistine lords came to her with an offer.
      [show:silver] [spot:silver] [say:Eleven hundred pieces of silver] Eleven hundred pieces of silver [hop:silver] from each of them,
      [lunge:lord] [spot:delilah:tight] if she would find the secret [exit:lord] of his strength.

  - id: the_bindings
    set: {name: glass_house}
    open: glass
    close: none
    cast:
      delilah: {character: delilah, at: [0.7, 0.95], height: 0.46}
      withs: {character: samson, params: {bound: withs}, at: [0.32, 0.95], height: 0.46}
      samson: {character: samson, at: [0.32, 0.95], height: 0.46, hidden: true}
      ropes: {character: samson, params: {bound: ropes}, at: [0.32, 0.95], height: 0.46, hidden: true}
    narration: |
      [spot:delilah] So she asked him.
      [spot:withs] [scroll:withs|Bind me with seven fresh bowstrings,] Bind me with seven fresh bowstrings, he said, [shake:withs] [spot:withs:tight] and I will be as weak as any man.
      [lunge:delilah] [spot:delilah] [scroll:delilah|the Philistines are upon you!] She bound him, and cried, [hop:delilah] the Philistines are upon you!
      [shake:withs] [swap:withs:samson] [flash:gold] [quake] He snapped them like thread.
      [swap:samson:ropes] [spot:ropes] Then new ropes. [shake:ropes] [swap:ropes:samson] [quake] He broke them off his arms.
      [spot:delilah] Then she wove his hair into her loom. [shake:samson] [quake] He tore the loom away.
      [spot:samson] Three times he lied. [spot:delilah] And three times, he stayed.
      [lunge:delilah] [spot:delilah:tight] She pressed him day after day, [spot:samson:tight] until at last, he told her everything.

  - id: the_razor
    set: {name: glass_house}
    open: none
    close: fade
    mood: somber
    cast:
      delilah: {character: delilah, at: [0.66, 0.95], height: 0.46}
      sleeper: {character: samson, params: {pose: sleep}, at: [0.36, 0.96], height: 0.2}
      locks: {prop: glass_locks, at: [0.255, 0.93], height: 0.09, depth: 1.0}
      barber: {character: philistine, params: {weapon: razor, face: right}, at: [0.12, 0.95], height: 0.44}
      samson: {character: samson, params: {hair: short}, at: [0.36, 0.95], height: 0.46, hidden: true}
    narration: |
      [spot:sleeper] She lulled him to sleep on her knees,
      [enter:barber] [spot:barber] and called for a man [lunge:barber] to shave off the seven locks of his head.
      [exit:locks:bottom] [lunge:barber] [spot:sleeper:tight] And his strength left him.
      [exit:barber] [lunge:delilah] [spot:delilah] [scroll:delilah|The Philistines are upon you, Samson!] The Philistines are upon you, Samson!
      [swap:sleeper:samson] [spot:samson] He woke, [shake:samson] and thought he would shake himself free, [shake:samson] as he always had.
      [shake:samson] [dark:0.3] [spot:samson:tight] [say:he did not know|ruby] But he did not know that the LORD had left him.

  - id: the_capture
    set: {name: glass_prison}
    open: glass
    close: fade
    mood: tense
    cast:
      samson: {character: samson, params: {hair: short}, at: [0.5, 0.95], height: 0.46}
      blind: {character: samson, params: {pose: chained, hair: short, blind: true}, at: [0.5, 0.95], height: 0.46, hidden: true}
      soldier1: {character: philistine, params: {weapon: spear, face: right}, at: [0.22, 0.95], height: 0.44}
      soldier2: {character: philistine, params: {weapon: sword}, at: [0.8, 0.95], height: 0.44}
    narration: |
      [enter:soldier1] [enter:soldier2] [spot:samson] The Philistines seized him.
      [shake:samson] [lunge:soldier2] [flash:red] [quake] [dark:0.18] They put out his eyes.
      [swap:samson:blind] [light] [spot:blind:tight] The strongest man in Israel [tilt:blind:-6] would never see again.

  - id: the_prison
    set: {name: glass_prison}
    open: glass
    close: fade
    mood: somber
    cast:
      mill: {prop: glass_grindstone, at: [0.66, 0.7], anchor: [0.5, 0.5], pivot: [0.5, 0.5], height: 0.42, depth: 0.95}
      samson: {character: samson, params: {pose: chained, hair: short, blind: true}, at: [0.32, 0.95], height: 0.46}
    narration: |
      [spot:samson] They bound him with chains of bronze, [shake:samson]
      [spin:mill:30] [spot:mill] and set him to grind grain in the prison at Gaza.
      [move:samson:0.38] [spot:samson] Day after day, [move:samson:0.3] round and round.
      [spot:samson:tight] But the Bible adds one quiet line.
      [label:samson.head|The hair grows back] [flood:0.9] [say:began to grow again] The hair of his head began to grow again.

  - id: the_temple
    set: {name: glass_hall}
    open: glass
    close: fade
    mood: battle
    cast:
      temple: {prop: glass_temple, params: {crowd: 0}, at: [0.5, 0.95], height: 0.8, depth: 0.9}
      crowd: {prop: glass_crowd, at: [0.5, 0.31], height: 0.13, depth: 0.9}
      samson: {character: samson, params: {pose: chained, hair: short, blind: true}, at: [0.5, 0.95], height: 0.42}
      pushing: {character: samson, params: {pose: push, hair: short, blind: true}, at: [0.5, 0.95], height: 0.42, hidden: true}
      boy: {prop: glass_boy, at: [0.6, 0.95], height: 0.26}
    narration: |
      [spot:temple:wide] The Philistines held a great feast [laugh:crowd] for their god Dagon.
      [laugh:crowd] [spot:crowd] [say:Three thousand|bottom] Three thousand men and women crowded the roof,
      [laugh:crowd] calling for Samson to be brought out to entertain them.
      [spot:boy] A boy led the blind man by the hand, [move:boy:0.56] [spot:samson] to the pillars [spot:temple.left_pillar] that held up the house.
      [exit:boy:right] [tilt:samson:-5] [spot:samson:tight] And Samson prayed.
      [flood:0.8] [scroll:samson|O Lord GOD, remember me, and strengthen me, only this once.] O Lord GOD, remember me, [spot:samson] and strengthen me, [spot:samson:tight] only this once.
      [swap:samson:pushing] [push:pushing] [spot:pushing] He took hold of the two middle pillars, [spot:pushing.right_hand] one with his right hand [spot:pushing.left_hand] and one with his left,
      [shake:pushing] [shake:temple] [quake] and pushed with all his might.
      [shatter:temple] [shatter:crowd] [shatter:pushing] [quake:0.03] [flash:white] [spot:all:wide] The house fell.
      [dark:0.32] In his death, [quake] Samson defeated more of Israel's enemies [spot:all] than in all his life.
    tail: 1.6

  # ======================================================================= reading the window
  - id: read_the_vows
    set: {name: glass_vineyard}
    open: glass
    close: fade
    mood: psalm
    cast:
      samson: {character: samson, at: [0.3, 0.95], height: 0.46}
      lion: {prop: glass_lion, at: [0.68, 0.95], height: 0.26}
    narration: |
      [fall:lion:right] [spot:all] Now, let's read this window.
      [spot:samson] Most people think Samson fell [tilt:samson:-5] on the day his hair was cut. [tilt:samson:0] [spot:samson:tight] [say:Look closer.] Look closer.
      [spot:lion] On his way back through Timnah, he turned aside to the lion's carcass, [lunge:samson] and scooped honey out of it.
      [label:lion|First vow: nothing dead] [spot:lion:tight] A Nazarite was never to touch the dead.
      [hop:samson] [spot:samson] Then he threw a feast, [laugh:samson] and the Hebrew word for it means a drinking feast.
      [label:samson|Second vow: no wine] Wine was the second vow.
      [label:samson.hair|Third vow: no razor] [spot:samson:tight] So the haircut was not the first vow Samson broke. [flash:gold] [say:It was the last.|ruby|center] It was the last.

  - id: read_the_light
    set: {name: glass_house}
    open: glass
    close: fade
    cast:
      samson: {character: samson, at: [0.5, 0.95], height: 0.5}
    narration: |
      [spot:samson] And the most chilling line in the story is this one. [dark:0.3] [spot:samson:tight] He did not know the LORD had left him.
      [tilt:samson:-6] [spot:samson:tight] Drift rarely announces itself.
      [light] [flood] But now hold this window up to the light.
      [label:samson.hair|Not the source] Samson's strength was never in his hair.
      [spot:all:wide] Every time it came, [label:samson|Judges 14:6, 14:19, 15:14] the text says the same thing. [flash:gold] The Spirit of the LORD came upon him.
      [tilt:samson:0] [spot:samson] The hair was the sign of a promise. [flood:1.3] [say:The strength was God's.|center] The strength was God's.

  - id: read_the_thread
    set: {name: glass_hall}
    open: glass
    close: fade
    mood: wonder
    cast:
      samson: {character: samson, params: {pose: push, hair: short, blind: true}, at: [0.42, 0.95], height: 0.5}
    routes:
      thread: [samson.center, [0.7, 0.4], [0.97, 0.14]]
    narration: |
      [spot:samson] Now follow the thread.
      [spot:samson:wide] A deliverer promised by an angel, [label:samson.head|Promised before birth] set apart before his birth, [spot:samson] who won his greatest victory [label:samson.right_hand|Arms stretched out] with his arms stretched out, [spot:samson:tight] in his death.
      [ink:thread:gold] [say:a better deliverer] Samson is a broken picture of a better deliverer.
      [shake:samson] [spot:samson:tight] Samson died asking God to avenge his eyes.
      [flood:1.2] Jesus died praying for the people who crucified him. [label:samson|Luke 23:34] [say:Father, forgive them.|white] Father, forgive them.

  - id: the_verse
    set: {name: scroll}
    open: glass
    close: fade
    mood: psalm
    cast:
      verse: {prop: verse, params: {text: "O Lord GOD, remember me, I pray thee, and strengthen me, I pray thee, only this once, O God, that I may be at once avenged of the Philistines for my two eyes.", ref: "Judges 16:28 (KJV)", width: 1.45},
              at: [0.5, 0.86], height: 0.66, depth: 0.6}
    narration: |
      [spot:verse:wide] Even Samson's last prayer was not a noble one.
      [write:verse] O Lord GOD, remember me, I pray thee, and strengthen me, I pray thee, only this once, O God, that I may be at once avenged of the Philistines for my two eyes.
      [spot:all] And God still answered it. [flood:1.1] Centuries later, [label:verse|Hebrews 11:32] the book of Hebrews names Samson among the heroes of faith.
      [spot:verse] The hair grew back. [flash:gold] [say:That is grace.|white|bottom] That is grace.
      [spot:verse:tight] So, what small compromise [spot:verse] are you telling yourself [spot:verse:tight] does not matter?
      [pause:1.5]

  - id: the_great_window
    set: {name: great_window, exclude: 14}
    routes:
      toward_centre: ["@pane14", centre]
    open: glass
    close: fade
    mood: triumph
    cast:
      pane: {prop: pane_image, params: {path: "{series}/panes/14.png"}, at: [0.5, 0.5], anchor: [0.5, 0.5],
             height: 0.8, depth: 0.6, hires: 1}
    narration: |
      [spot:pane] Every story in this series [spot:pane:wide] is one pane of a single great window.
      [settle:pane:@pane14] Samson takes his place among the judges and the kings, [spot:@pane17] next to David.
      [spot:@centre] And at the centre, the window is still dark. [ink:toward_centre:gold] Every pane points toward it.
      [spot:all:wide] By the end, you'll see why.
    tail: 2.6
