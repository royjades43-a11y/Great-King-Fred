          e.mouth.forEach(([m, t], i) => {
            if (i === 0) { cur = m; return; }
            tl.fromTo("#" + e.id + "-m-" + cur, { opacity: 1 }, { opacity: 0, duration: 0.06 }, t);
            tl.fromTo("#" + e.id + "-m-" + m, { opacity: 0 }, { opacity: 1, duration: 0.06 }, t);
            cur = m;
          });
        }
        if (e.tilt) {
          let prev = e.tilt[0][0];
          tl.set("#" + e.id + "-beam", { rotation: prev, svgOrigin: "300 120" }, 0);
          tl.set("#" + e.id + "-panL", { rotation: -prev, svgOrigin: "90 120" }, 0);
          tl.set("#" + e.id + "-panR", { rotation: -prev, svgOrigin: "510 120" }, 0);
          e.tilt.slice(1).forEach(([d, t]) => {
            tl.fromTo("#" + e.id + "-beam", { rotation: prev, svgOrigin: "300 120" }, { rotation: d, svgOrigin: "300 120", duration: 0.7, ease: "back.out(1.6)" }, t);
            tl.fromTo("#" + e.id + "-panL", { rotation: -prev, svgOrigin: "90 120" }, { rotation: -d, svgOrigin: "90 120", duration: 0.7, ease: "back.out(1.6)" }, t);
            tl.fromTo("#" + e.id + "-panR", { rotation: -prev, svgOrigin: "510 120" }, { rotation: -d, svgOrigin: "510 120", duration: 0.7, ease: "back.out(1.6)" }, t);
            prev = d;
          });
        }
        // ---- motion (on the outer box, so it never fights the entrance/exit on the inner one) ----
        const outer = "#" + e.id;
        if (e.move) {
          let px = 0, py = 0;
          e.move.forEach(([dx, dy, t, d]) => {
            tl.fromTo(outer, { x: px, y: py }, { x: dx, y: dy, duration: d, ease: "power2.inOut", immediateRender: false }, t);
            px = dx; py = dy;
          });
        }
        if (e.sway) {
          const half = e.period / 2, n = Math.max(1, Math.floor((e.out - e.in) / half));
          tl.fromTo(outer, { rotation: 0 }, { rotation: -e.sway, duration: half / 2, ease: "sine.out", immediateRender: false }, e.in);
          tl.fromTo(outer, { rotation: -e.sway }, { rotation: e.sway, duration: half, ease: "sine.inOut", repeat: n - 1, yoyo: true, immediateRender: false }, e.in + half / 2);
        }
        if (e.bob) {
          const half = e.period / 2, n = Math.max(1, Math.floor((e.out - e.in) / half));
          tl.fromTo(outer, { y: 0 }, { y: -e.bob, duration: half, ease: "sine.inOut", repeat: n - 1, yoyo: true, immediateRender: false }, e.in);
        }
        if (e.pulse) {
          for (let b = e.in + 0.5; b < e.out - 0.2; b += e.beat) {
            tl.fromTo(outer, { scale: 1 }, { scale: e.pulse, duration: 0.11, ease: "power2.out", immediateRender: false }, b);
            tl.fromTo(outer, { scale: e.pulse }, { scale: 1, duration: 0.24, ease: "power2.in", immediateRender: false }, b + 0.11);
          }
        }
        // ---- exit: back out the way it came, faster than it arrived ----
        const ex = e.exit || OPP[e.from];
        if (e.hold) {
        } else if (ex === "cut") {
          tl.set(inner, { opacity: 0 }, e.out);
        } else if (ex && OFF[ex]) {
          const [x, y] = OFF[ex];
          tl.fromTo(inner, { x: 0, y: 0, opacity: 1, filter: "blur(0px)" },
            { x: x * 0.8, y: y * 0.8, opacity: 0, filter: "blur(12px)", duration: e.outDur, ease: "power3.in", immediateRender: false }, e.out);
        } else {
          const r = e.t === "stamp" ? -8 : 0;
          tl.fromTo(inner, { scale: 1, opacity: 1, filter: "blur(0px)", rotation: r },
            { scale: 0.86, opacity: 0, filter: "blur(10px)", rotation: r, duration: e.outDur, ease: "power3.in", immediateRender: false }, e.out);
        }
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["semester"] = tl;
    })();
  </script>
</template>
