          const half = e.period / 2, n = Math.max(1, Math.floor((e.out - e.in) / half));
          tl.fromTo(outer, { rotation: 0 }, { rotation: -e.sway, duration: half / 2, ease: "sine.out", immediateRender: false }, e.in);
          tl.fromTo(outer, { rotation: -e.sway }, { rotation: e.sway, duration: half, ease: "sine.inOut", repeat: n - 1, yoyo: true, immediateRender: false }, e.in + half / 2);
        }
        if (e.bob) {
          const half = e.period / 2, n = Math.max(1, Math.floor((e.out - e.in) / half));
          tl.fromTo(outer, { y: 0 }, { y: -e.bob, duration: half, ease: "sine.inOut", repeat: n - 1, yoyo: true, immediateRender: false }, e.in);
        }
        if (e.pulse) {
          for (let b = e.in + 0.5; b < e.out - 0.2; b += e.beat) {
            tl.fromTo(outer, { scale: 1 }, { scale: e.pulse, duration: 0.11, ease: "power2.out", immediateRender: false }, b);
            tl.fromTo(outer, { scale: e.pulse }, { scale: 1, duration: 0.24, ease: "power2.in", immediateRender: false }, b + 0.11);
          }
        }
        // ---- exit: back out the way it came, faster than it arrived ----
        const ex = e.exit || OPP[e.from];
        if (ex && OFF[ex]) {
          const [x, y] = OFF[ex];
          tl.fromTo(inner, { x: 0, y: 0, opacity: 1, filter: "blur(0px)" },
            { x: x * 0.8, y: y * 0.8, opacity: 0, filter: "blur(12px)", duration: e.outDur, ease: "power3.in", immediateRender: false }, e.out);
        } else {
          const r = e.t === "stamp" ? -8 : 0;
          tl.fromTo(inner, { scale: 1, opacity: 1, filter: "blur(0px)", rotation: r },
            { scale: 0.86, opacity: 0, filter: "blur(10px)", rotation: r, duration: e.outDur, ease: "power3.in", immediateRender: false }, e.out);
        }
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["quiz"] = tl;
    })();
  </script>
</template>
